name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'www/**'
      - 'package.json'
      - 'capacitor.config.ts'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Install project dependencies
        run: npm install
      - name: Verify application source
        run: test -s www/index.html
      - name: Generate native Android project
        run: npx cap add android
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Allow autoplay media in Android WebView
        run: |
          ACTIVITY="android/app/src/main/java/mx/ogdigitalsolutions/betterwarepedidos/MainActivity.java"
          test -f "$ACTIVITY"
          cat > "$ACTIVITY" <<'EOF'
          package mx.ogdigitalsolutions.betterwarepedidos;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  if (bridge != null && bridge.getWebView() != null) {
                      bridge.getWebView().getSettings().setMediaPlaybackRequiresUserGesture(false);
                  }
              }
          }
          EOF
          cat "$ACTIVITY"
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Betterware-Control-Pedidos-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
